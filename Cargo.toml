[package]
name = "git-toprepo"
version = "0.0.0"
license = "MIT OR Apache-2.0"
edition = "2024"

[workspace]
members = ["lib/testtools"]

[dependencies]
anyhow = "1.0.104"
bincode = { version = "2.0.1", features = ["serde"] }
bstr = { version = "1.13.1", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
# clap feature unstable-v5 includes default max_term_width=100.
clap = { version = "4.6.7", features = ["derive", "string", "wrap_help", "unstable-v5"] }
colored = "3.1.1"
encoding_rs = "0.8.42"
gix = { version = "0.73.0", features = ["serde"] }
hex = "0.4.3"
indicatif = "0.18.6"
itertools = "0.14.0"
lazy_static = "1.5.1"
log = "0.4.34"
oneshot = "0.1.13"
pathdiff = "0.2.3"
serde = { version = "1.0.229", features = ["default", "derive", "std"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
serde_with = { version = "3.24.0", features = ["macros"] }
sha2 = "0.10.9"
signal-hook = "0.3.18"
threadpool = "1.8.1"
toml = "0.9.12"
tracing = "0.1.44"
tracing-chrome = "0.7.2"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
wait-timeout = "0.2.1"

[dev-dependencies]
assert_cmd = "2.2.2"
git-toprepo-testtools = { path = "lib/testtools" }
gix-testtools = "0.16.1"
insta = "1.49.0"
predicates = "3.1.4"
pretty_assertions = "1.4.1"
rstest = "0.26.1"
stacker = "0.1.25"
tempfile = "3.27.0"

[[bin]]
name = "git-toprepo"
path = "src/main.rs"
